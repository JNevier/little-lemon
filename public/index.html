<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The small icon shown in the browser tab. -->
    <link rel="icon" type="image/png" href="/images/lemon-yellow.png" />
    <!-- Google Fonts: Markazi Text for headings, Karla for body text. -->
    <!-- "preconnect" opens the connection early so the fonts load faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Markazi+Text:wght@400;500&display=swap" />
    <title>Little Lemon</title>
    <meta name="description" content="Reserve a table at Little Lemon, a family-owned Mediterranean restaurant in Chicago." />
    <meta property="og:title" content="Little Lemon" />
    <meta property="og:description" content="Reserve a table at Little Lemon, a family-owned Mediterranean restaurant in Chicago." />
    <meta property="og:type" content="website" />
    <!-- The site's public address, so a shared link always points at the live site. -->
    <meta property="og:url" content="https://littlelemon-chicago.vercel.app/" />
    <!-- Social preview image. Social sites fetch it from their own servers, so it must be a full https:// URL, not "/images/...". -->
    <meta property="og:image" content="https://littlelemon-chicago.vercel.app/images/logo-green-yellow-lemon.png" />
    <meta property="og:image:alt" content="A yellow lemon with two dark green leaves, on the right says dark green Little Lemon" />
  </head>
